{% extends "_layout.html" %}

{% block body %}
<main class="container mt-4" style="margin-bottom: 6em;">
    <select class="select">
        {% for ye in years %}
        <option value="?y={{ ye.Year }}">{{ ye.Year }}</option>
        {% endfor %}
    </select>


    {% for post in posts %}
    <article class="p-0 mb-5 trix-content">
        <div style="margin-bottom: .3em">
            <strong style="color:#555">{{ post.EventTime.Format("Monday, 2006-01-02") }}</strong>
            — <a style="color: #999; text-decoration: none;" href="/posts/{{ post.Id.String() }}/edit">edit</a>
        </div>
        {{ post.Body|safe }}
    </article>
    {% endfor %}

    <!--
    <div class="join">
        {% for p in pagination %}
        <a class="join-item btn {% if p.Ord == page %}btn-active{% endif %}" href="?{{ p.Params }}">{{ p.Ord }}</a>
        {% endfor %}
    </div>
    -->

    {% if reauth %}<div class="justify-content-center flex-wrap" style="text-align: center; margin: 2em 0 2em 0">Please <a href="/login">re-authenticate</a> to see more entries</div>{% endif %}

</main>

<div class="fab" style="margin-bottom: 4em;">
    <a class="btn btn-lg btn-circle btn-primary" href="/new"> <svg
            aria-label="New"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="size-6"
    >
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg></a>
</div>

{% endblock %}
